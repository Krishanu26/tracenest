# Application-level job admission control.
dataflow.jobs.worker-count=${DATAFLOW_JOB_WORKERS:4}
dataflow.jobs.queue-capacity=${DATAFLOW_JOB_QUEUE_CAPACITY:32}
dataflow.jobs.terminal-retention-count=${DATAFLOW_JOB_TERMINAL_RETENTION_COUNT:1000}
dataflow.events.issue-retention-count=${DATAFLOW_EVENT_ISSUE_RETENTION_COUNT:1000}

# Multipart upload guardrails. Tune these limits for the deployment environment.
spring.servlet.multipart.max-file-size=${DATAFLOW_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${DATAFLOW_MAX_REQUEST_SIZE:21MB}
dataflow.engine.worker-count=${DATAFLOW_ENGINE_WORKERS:8}
dataflow.engine.queue-capacity=${DATAFLOW_ENGINE_QUEUE_CAPACITY:512}
